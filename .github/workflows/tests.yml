# Runs Ruff and the whole pytest suite on every pull request and on every push
# to main (which includes merged pull requests). Tests never touch the network.
# release.yml also calls this workflow before it publishes a release.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # also allow a manual run from the Actions tab
  workflow_call:       # release.yml runs the same checks

permissions:
  contents: read

# A newer push to the same PR or branch cancels the run still going for it.
# github.workflow is the caller's name when release.yml calls this, so a
# release never cancels (or waits on) a normal run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Pinned so a new Ruff release can't turn main red by itself.
      - run: python -m pip install ruff==0.17.4
      - run: ruff check --output-format=github .

  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]   # the oldest supported (pyproject.toml) and the newest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      # The window tests need a display; Linux runners have none, so give them a
      # virtual one. Without it those tests would skip instead of run.
      - name: Install a virtual display (Linux)
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -ra

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m pytest -ra
