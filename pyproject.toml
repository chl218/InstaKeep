[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instakeep"
version = "0.1.0"
description = "Keep a list of public Instagram profiles and download their newest posts"
requires-python = ">=3.10"
dependencies = ["instaloader>=4.14,<5", "piexif>=1.1.3", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
igdl = "igdl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["graphify-out"]

[tool.ruff.lint]
# Ruff's defaults plus bugbear. No formatter.
select = ["E4", "E7", "E9", "F", "B"]
