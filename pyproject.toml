[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instakeep"
version = "0.1.0"
description = "Keep a list of public Instagram profiles and download their newest posts"
requires-python = ">=3.10"
dependencies = ["instaloader>=4.14", "piexif>=1.1.3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
igdl = "igdl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
